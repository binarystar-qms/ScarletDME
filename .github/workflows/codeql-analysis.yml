name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '17 13 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Not ubuntu-latest: the engine includes <termio.h>, which current glibc no longer ships. The release the
    # engine's Docker image is built on (Ubuntu 20.04) is out of the hosted runners, so the oldest one left.
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The engine is compiled as a 32-bit program (ARCH := -m32 in the Makefile), which autobuild cannot
    # set up: it needs the 32-bit C library and headers installed first.
    - name: Install the 32-bit toolchain
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib libc6-dev-i386 libcrypt-dev:i386

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    # CodeQL traces this build, so the whole engine must really be compiled. The source predates C23, where
    # `bool` became a keyword (it declares its own `typedef int16_t bool`), so the language level of the
    # runner's current gcc is pinned to the one the engine was written for.
    - name: Build the engine
      run: make COMP="gcc -std=gnu17"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
