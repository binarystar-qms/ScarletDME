name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '17 13 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # The engine is compiled as a 32-bit program (ARCH := -m32 in the Makefile), which autobuild cannot
    # set up: it needs the 32-bit C library and headers installed first.
    - name: Install the 32-bit toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib libc6-dev-i386

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    # CodeQL traces this build, so the whole engine must really be compiled.
    - name: Build the engine
      run: make

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
